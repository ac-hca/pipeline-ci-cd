apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskflow-development

resources:
  - ../../base
  - namespace.yaml

configMapGenerator:
  - name: taskflow-config
    literals:
      - APP_NAME=TaskFlow API
      - APP_ENV=development
      - APP_VERSION=0.1.0
      - LOG_LEVEL=INFO
      - CORS_ALLOWED_ORIGINS=

secretGenerator:
  - name: taskflow-secrets
    envs:
      - secrets.env

images:
  - name: taskflow-api
    newName: taskflow-api
    newTag: k8s-dev

patches:
  - path: patches/api-image-policy.yaml
