controller:
  kind: deployment
  replicaCount: 1
  nginxplus: false
  enableCustomResources: false
  enableOIDC: false
  enableSnippets: false
  enableExternalDNS: false
  enableCertManager: false
  ingressClass:
    name: nginx
    create: true
    setAsDefaultIngress: false
  service:
    type: ClusterIP
    externalTrafficPolicy: Cluster
    httpsPort:
      enable: false
  reportIngressStatus:
    enable: false
  telemetryReporting:
    enable: false
  prometheus:
    create: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL
      add:
        - NET_BIND_SERVICE
  initContainerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL
  initContainerResources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
