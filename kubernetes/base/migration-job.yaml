apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-migrate
  annotations:
    checkov.io/skip1: CKV_K8S_43=The development image is built and loaded locally; production uses an immutable sha-* tag.
    checkov.io/skip2: CKV_K8S_15=Development must use imagePullPolicy Never for the image loaded into Minikube.
  labels:
    app.kubernetes.io/name: taskflow-migrate
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: taskflow-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: taskflow-api:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
          args:
            - |
              import os
              import time

              import psycopg

              database_url = (
                  open("/var/run/secrets/taskflow/DATABASE_URL", encoding="utf-8")
                  .read()
                  .strip()
                  .replace("postgresql+psycopg://", "postgresql://", 1)
              )

              for attempt in range(60):
                  try:
                      with psycopg.connect(database_url):
                          break
                  except psycopg.OperationalError:
                      if attempt == 59:
                          raise
                      time.sleep(2)
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: taskflow-secrets
              mountPath: /var/run/secrets/taskflow
              readOnly: true
      containers:
        - name: migrate
          image: taskflow-api:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              export DATABASE_URL="$(cat /var/run/secrets/taskflow/DATABASE_URL)"
              exec alembic upgrade head
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: taskflow-secrets
              mountPath: /var/run/secrets/taskflow
              readOnly: true
      volumes:
        - name: taskflow-secrets
          secret:
            secretName: taskflow-secrets
            defaultMode: 0440
