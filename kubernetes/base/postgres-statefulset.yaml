apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskflow-postgres
  annotations:
    checkov.io/skip1: CKV_K8S_43=The patch and Alpine versions are fixed; the multi-architecture digest is verified during release maintenance.
    checkov.io/skip2: CKV_K8S_40=The official postgres Alpine image intentionally runs as its non-root UID 70.
  labels:
    app.kubernetes.io/name: taskflow-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: taskflow-postgres
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24
          imagePullPolicy: Always
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB_FILE
              value: /var/run/secrets/taskflow/POSTGRES_DB
            - name: POSTGRES_USER_FILE
              value: /var/run/secrets/taskflow/POSTGRES_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/secrets/taskflow/POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: temporary-files
              mountPath: /tmp
            - name: taskflow-secrets
              mountPath: /var/run/secrets/taskflow
              readOnly: true
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 16Mi
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
        - name: taskflow-secrets
          secret:
            secretName: taskflow-secrets
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: taskflow-postgres
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
