apiVersion: v1
kind: Service
metadata:
  name: taskflow-postgres
  labels:
    app.kubernetes.io/name: taskflow-postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: taskflow-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
