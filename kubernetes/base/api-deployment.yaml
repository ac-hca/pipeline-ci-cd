apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  annotations:
    checkov.io/skip1: CKV_K8S_43=The development image is built and loaded locally; production uses an immutable sha-* tag.
    checkov.io/skip2: CKV_K8S_15=Development must use imagePullPolicy Never for the image loaded into Minikube.
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: taskflow-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: taskflow-api:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              export DATABASE_URL="$(cat /var/run/secrets/taskflow/DATABASE_URL)"
              attempt=1
              until alembic current --check-heads; do
                if [ "$attempt" -ge 60 ]; then
                  echo "Database migrations did not reach the current head" >&2
                  exit 1
                fi
                attempt=$((attempt + 1))
                sleep 2
              done
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: taskflow-secrets
              mountPath: /var/run/secrets/taskflow
              readOnly: true
      containers:
        - name: api
          image: taskflow-api:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              export DATABASE_URL="$(cat /var/run/secrets/taskflow/DATABASE_URL)"
              exec uvicorn app.main:app --host 0.0.0.0 --port 8000
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: taskflow-config
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: taskflow-secrets
              mountPath: /var/run/secrets/taskflow
              readOnly: true
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
        - name: taskflow-secrets
          secret:
            secretName: taskflow-secrets
            defaultMode: 0440
