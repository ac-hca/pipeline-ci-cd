name: Continuous Delivery

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: taskflow-development-delivery
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ac-hca/pipeline-ci-cd
  TERRAFORM_VERSION: 1.16.7
  KUBERNETES_VERSION: v1.37.0
  MINIKUBE_VERSION: 1.39.0
  MINIKUBE_LINUX_AMD64_SHA256: 099477eaf248bcb5bcea8ce78a2898e93ac01461c35189da1848c3de82ecd22e
  HELM_VERSION: v4.3.1
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0
  KUBERNETES_CONTEXT: taskflow-development
  TASKFLOW_NAMESPACE: taskflow-development
  TERRAFORM_DIR: terraform/environments/development

jobs:
  deliver-development:
    name: Deliver and verify ephemeral development
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      TF_IN_AUTOMATION: true

    steps:
      - name: Check out the validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Configure isolated runtime paths
        run: |
          echo "EVIDENCE_DIR=${RUNNER_TEMP}/taskflow-evidence" >> "$GITHUB_ENV"
          echo "KUBECONFIG=${RUNNER_TEMP}/taskflow-kubeconfig" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBERNETES_VERSION }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install verified Minikube CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/taskflow-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/kubernetes/minikube/releases/download/v${MINIKUBE_VERSION}/minikube-linux-amd64" \
            --output "${RUNNER_TEMP}/taskflow-bin/minikube"
          echo "${MINIKUBE_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/taskflow-bin/minikube" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/taskflow-bin/minikube"
          echo "${RUNNER_TEMP}/taskflow-bin" >> "$GITHUB_PATH"

      - name: Resolve immutable delivery image
        id: image
        run: |
          set -euo pipefail
          image_tag="sha-${SOURCE_SHA:0:7}"
          image_ref="${REGISTRY}/${IMAGE_NAME}:${image_tag}"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Initialize evidence directory
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Source revision: $SOURCE_SHA"
            echo "Requested image: $IMAGE_REF"
            echo "Trigger: $GITHUB_EVENT_NAME"
          } > "$EVIDENCE_DIR/delivery-metadata.txt"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify the approved image
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          image_revision="$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE_REF")"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$image_revision" != "$SOURCE_SHA" ]]; then
            echo "Image revision $image_revision does not match validated revision $SOURCE_SHA" >&2
            exit 1
          fi

          docker image inspect \
            --format 'Reference={{index .RepoDigests 0}} Revision={{index .Config.Labels "org.opencontainers.image.revision"}}' \
            "$IMAGE_REF" | tee "$EVIDENCE_DIR/image.txt"
          docker tag "$IMAGE_REF" taskflow-api:k8s-dev

      - name: Plan and create Minikube with Terraform
        run: |
          set -euo pipefail
          terraform -chdir="$TERRAFORM_DIR" init -input=false -no-color
          terraform -chdir="$TERRAFORM_DIR" validate -no-color
          terraform -chdir="$TERRAFORM_DIR" plan \
            -input=false \
            -no-color \
            -out="${RUNNER_TEMP}/taskflow-development.tfplan"
          terraform -chdir="$TERRAFORM_DIR" show \
            -no-color \
            "${RUNNER_TEMP}/taskflow-development.tfplan" \
            > "$EVIDENCE_DIR/terraform-plan.txt"
          terraform -chdir="$TERRAFORM_DIR" apply \
            -input=false \
            -no-color \
            "${RUNNER_TEMP}/taskflow-development.tfplan"
          kubectl --context "$KUBERNETES_CONTEXT" wait \
            --for=condition=Ready node --all --timeout=5m

      - name: Install Ingress and Metrics Server
        run: |
          set -euo pipefail
          helm upgrade --install nginx-ingress oci://ghcr.io/nginx/charts/nginx-ingress \
            --version 2.8.0 \
            --namespace nginx-ingress \
            --create-namespace \
            --values kubernetes/platform/nginx-ingress/values.yaml \
            --kube-context "$KUBERNETES_CONTEXT" \
            --wait \
            --timeout 5m

          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update metrics-server
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --version 3.14.0 \
            --namespace kube-system \
            --values kubernetes/platform/metrics-server/values.yaml \
            --kube-context "$KUBERNETES_CONTEXT" \
            --wait \
            --timeout 5m

      - name: Load the approved image into Minikube
        run: |
          set -euo pipefail
          minikube image load taskflow-api:k8s-dev --profile "$KUBERNETES_CONTEXT"
          minikube image ls --profile "$KUBERNETES_CONTEXT" | grep 'taskflow-api:k8s-dev'

      - name: Create ephemeral application secrets
        run: |
          set -euo pipefail
          umask 077
          database_password="$(openssl rand -hex 24)"
          {
            echo "POSTGRES_DB=taskflow"
            echo "POSTGRES_USER=taskflow"
            echo "POSTGRES_PASSWORD=$database_password"
            echo "DATABASE_URL=postgresql+psycopg://taskflow:${database_password}@taskflow-postgres:5432/taskflow"
          } > kubernetes/overlays/development/secrets.env

      - name: Deploy PostgreSQL, migrations and TaskFlow API
        run: |
          set -euo pipefail
          kubectl --context "$KUBERNETES_CONTEXT" apply \
            -k kubernetes/overlays/development
          kubectl --context "$KUBERNETES_CONTEXT" -n "$TASKFLOW_NAMESPACE" \
            rollout status statefulset/taskflow-postgres --timeout=5m
          kubectl --context "$KUBERNETES_CONTEXT" -n "$TASKFLOW_NAMESPACE" \
            wait --for=condition=complete job/taskflow-migrate --timeout=5m
          kubectl --context "$KUBERNETES_CONTEXT" -n "$TASKFLOW_NAMESPACE" \
            rollout status deployment/taskflow-api --timeout=5m
          kubectl --context "$KUBERNETES_CONTEXT" -n "$TASKFLOW_NAMESPACE" \
            wait --for=condition=Available deployment/taskflow-api --timeout=2m

      - name: Verify Kubernetes idempotence and metrics
        run: |
          set -euo pipefail
          kubectl --context "$KUBERNETES_CONTEXT" apply \
            -k kubernetes/overlays/development
          kubectl --context "$KUBERNETES_CONTEXT" diff \
            -k kubernetes/overlays/development
          kubectl --context "$KUBERNETES_CONTEXT" wait \
            --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=3m

          for _attempt in {1..30}; do
            if kubectl --context "$KUBERNETES_CONTEXT" top pods -n "$TASKFLOW_NAMESPACE" \
              > "$EVIDENCE_DIR/metrics-initial.txt"; then
              exit 0
            fi
            sleep 5
          done

          echo "Metrics Server did not publish Pod metrics" >&2
          exit 1

      - name: Run smoke tests and OWASP ZAP
        run: |
          set -euo pipefail
          kubectl --context "$KUBERNETES_CONTEXT" -n nginx-ingress \
            port-forward service/nginx-ingress-controller 8080:80 \
            > "$EVIDENCE_DIR/ingress-port-forward.log" 2>&1 &
          ingress_pid="$!"

          kubectl --context "$KUBERNETES_CONTEXT" -n "$TASKFLOW_NAMESPACE" \
            port-forward service/taskflow-api 8000:80 \
            > "$EVIDENCE_DIR/api-port-forward.log" 2>&1 &
          api_pid="$!"

          stop_port_forwards() {
            kill "$ingress_pid" "$api_pid" 2>/dev/null || true
            wait "$ingress_pid" "$api_pid" 2>/dev/null || true
          }
          trap stop_port_forwards EXIT

          TASKFLOW_BASE_URL=http://127.0.0.1:8080 \
            TASKFLOW_HOST_HEADER=taskflow.local \
            scripts/cd/smoke-test.sh
          ZAP_TARGET=http://127.0.0.1:8000/openapi.json \
            scripts/cd/run-zap.sh

      - name: Collect deployment evidence
        if: always()
        env:
          DELIVERED_IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: scripts/cd/collect-evidence.sh

      - name: Remove Kubernetes resources
        if: always()
        run: |
          set +e
          kubectl --context "$KUBERNETES_CONTEXT" delete \
            -k kubernetes/overlays/development --ignore-not-found --wait=true
          helm uninstall nginx-ingress \
            --namespace nginx-ingress \
            --kube-context "$KUBERNETES_CONTEXT" || true
          helm uninstall metrics-server \
            --namespace kube-system \
            --kube-context "$KUBERNETES_CONTEXT" || true
          rm -f kubernetes/overlays/development/secrets.env

      - name: Destroy Minikube with Terraform
        if: always()
        run: |
          set +e
          terraform -chdir="$TERRAFORM_DIR" destroy \
            -auto-approve \
            -input=false \
            -no-color
          destroy_status="$?"
          echo "Terraform destroy exit code: $destroy_status" \
            > "$EVIDENCE_DIR/terraform-destroy.txt"
          exit "$destroy_status"

      - name: Confirm complete cleanup
        if: always()
        run: |
          set -euo pipefail
          state_resources="$(terraform -chdir="$TERRAFORM_DIR" state list)"
          remaining_container="$(docker ps --all \
            --filter name=taskflow-development \
            --format '{{.ID}}')"

          {
            echo "Terraform state resources: ${state_resources:-none}"
            echo "Minikube profiles:"
            minikube profile list -o json || true
            echo "Matching Docker containers: ${remaining_container:-none}"
          } > "$EVIDENCE_DIR/cleanup.txt"

          if [[ -n "$state_resources" || -n "$remaining_container" ]]; then
            echo "Delivery cleanup left managed resources behind" >&2
            exit 1
          fi
          if minikube status --profile "$KUBERNETES_CONTEXT" >/dev/null 2>&1; then
            echo "Minikube profile still exists after Terraform destroy" >&2
            exit 1
          fi

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: taskflow-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/taskflow-evidence
          if-no-files-found: error
          retention-days: 14
