name: Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ac-hca/pipeline-ci-cd
  TEST_IMAGE: taskflow-api:test
  RUNTIME_IMAGE: taskflow-api:runtime
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1-debian
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.29
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0-alpine
  TRIVY_IMAGE: aquasec/trivy:0.76.0
  SECURITY_PYTHON_IMAGE: python:3.12-slim
  TERRAFORM_VERSION: 1.16.7
  KUBERNETES_VERSION: v1.37.0

jobs:
  test:
    name: Migrations, quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://taskflow_test:taskflow_test@taskflow-postgres:5432/taskflow_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test --tag "$TEST_IMAGE" --file docker/Dockerfile .

      - name: Start temporary PostgreSQL
        run: |
          set -euo pipefail
          docker network create taskflow-ci
          docker run --detach \
            --name taskflow-postgres \
            --network taskflow-ci \
            --env POSTGRES_DB=taskflow_test \
            --env POSTGRES_USER=taskflow_test \
            --env POSTGRES_PASSWORD=taskflow_test \
            --health-cmd="pg_isready -U taskflow_test -d taskflow_test" \
            --health-interval=2s \
            --health-timeout=3s \
            --health-retries=15 \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for _attempt in {1..30}; do
            health_status="$(docker inspect --format='{{.State.Health.Status}}' taskflow-postgres)"
            if [ "$health_status" = "healthy" ]; then
              exit 0
            fi
            if [ "$health_status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          docker logs taskflow-postgres
          exit 1

      - name: Run database migrations
        run: |
          docker run --rm \
            --network taskflow-ci \
            --env APP_ENV=test \
            --env DATABASE_URL="$DATABASE_URL" \
            "$TEST_IMAGE" \
            alembic upgrade head

      - name: Run Ruff
        run: docker run --rm "$TEST_IMAGE" ruff check .

      - name: Check formatting
        run: docker run --rm "$TEST_IMAGE" ruff format --check .

      - name: Run tests with minimum coverage
        run: |
          docker run --rm \
            --network taskflow-ci \
            --env APP_ENV=test \
            --env DATABASE_URL="$DATABASE_URL" \
            "$TEST_IMAGE" \
            pytest -q --cov-fail-under=80

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker logs taskflow-postgres || true

      - name: Clean up test services
        if: always()
        run: |
          docker rm --force taskflow-postgres || true
          docker network rm taskflow-ci || true

  sast-and-dependencies:
    name: SAST and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Bandit SAST and audit Python dependencies
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            "$SECURITY_PYTHON_IMAGE" \
            sh -c 'pip install --disable-pip-version-check --requirement requirements-security.txt \
              && bandit --recursive app --severity-level medium --confidence-level medium \
              && pip-audit --requirement requirements.txt --strict'

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm \
            --volume "$PWD:/repository:ro" \
            "$GITLEAKS_IMAGE" \
            git --redact --verbose /repository

  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: terraform/environments/development

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without a remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBERNETES_VERSION }}

      - name: Reject committed runtime secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(secrets\.env|[^/]*-secrets?\.ya?ml)$'; then
            echo "Runtime Kubernetes secrets must not be committed" >&2
            exit 1
          fi

      - name: Prepare non-sensitive validation inputs
        run: |
          cp kubernetes/overlays/development/secrets.env.example \
            kubernetes/overlays/development/secrets.env
          cp kubernetes/overlays/production/secrets.env.example \
            kubernetes/overlays/production/secrets.env
          mkdir -p "${RUNNER_TEMP}/kubernetes-rendered"

      - name: Render development and production overlays
        run: |
          kubectl kustomize kubernetes/overlays/development \
            > "${RUNNER_TEMP}/kubernetes-rendered/development.yaml"
          kubectl kustomize kubernetes/overlays/production \
            > "${RUNNER_TEMP}/kubernetes-rendered/production.yaml"

      - name: Validate Kubernetes schemas
        run: |
          docker run --rm \
            --volume "${RUNNER_TEMP}/kubernetes-rendered:/manifests:ro" \
            "$KUBECONFORM_IMAGE" \
            -strict \
            -summary \
            -kubernetes-version 1.37.0 \
            /manifests/development.yaml \
            /manifests/production.yaml

      - name: Scan rendered manifests with Checkov
        run: |
          docker run --rm \
            --volume "${RUNNER_TEMP}/kubernetes-rendered:/manifests:ro" \
            "$CHECKOV_IMAGE" \
            --directory /manifests \
            --framework kubernetes \
            --compact \
            --quiet

  infrastructure-security:
    name: Dockerfile and infrastructure review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "$HADOLINT_IMAGE" \
            hadolint /workspace/docker/Dockerfile

      - name: Scan container and workflow configuration with Checkov
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "$CHECKOV_IMAGE" \
            --directory /workspace \
            --framework dockerfile github_actions yaml \
            --skip-path /workspace/kubernetes \
            --compact \
            --quiet

      - name: Scan Terraform with Checkov
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            "$CHECKOV_IMAGE" \
            --directory /workspace/terraform \
            --framework terraform \
            --compact \
            --quiet

  image-security:
    name: Runtime image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime --tag "$RUNTIME_IMAGE" --file docker/Dockerfile .

      - name: Export runtime image for isolated scanning
        run: docker save --output "${RUNNER_TEMP}/taskflow-runtime.tar" "$RUNTIME_IMAGE"

      - name: Scan runtime image with Trivy
        run: |
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            --volume "${RUNNER_TEMP}/taskflow-runtime.tar:/scan/taskflow-runtime.tar:ro" \
            --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/" \
            "$TRIVY_IMAGE" \
            image \
            --input /scan/taskflow-runtime.tar \
            --scanners vuln \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL

  runtime-image:
    name: Runtime image smoke test
    needs:
      - test
      - sast-and-dependencies
      - secrets
      - infrastructure-security
      - image-security
      - terraform
      - kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime --tag "$RUNTIME_IMAGE" --file docker/Dockerfile .

      - name: Start runtime image
        run: |
          docker run --detach \
            --name taskflow-runtime \
            --publish 8000:8000 \
            "$RUNTIME_IMAGE"

      - name: Verify application startup
        run: |
          set -euo pipefail
          for _attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' taskflow-runtime)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs taskflow-runtime
          exit 1

      - name: Show application logs on failure
        if: failure()
        run: docker logs taskflow-runtime || true

      - name: Clean up runtime container
        if: always()
        run: docker rm --force taskflow-runtime || true

  publish-image:
    name: Publish runtime image to GHCR
    if: github.event_name == 'push'
    needs:
      - runtime-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare immutable image references
        id: refs
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          sha_ref="${REGISTRY}/${IMAGE_NAME}:sha-${short_sha}"
          image_refs=("$sha_ref")

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            image_refs+=("${REGISTRY}/${IMAGE_NAME}:main")
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            image_refs+=("${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${image_refs[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Summarize published image
        env:
          IMAGE_REFS: ${{ steps.refs.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published multi-architecture image"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "Digest: \`$IMAGE_DIGEST\`"
            echo
            while IFS= read -r image_ref; do
              printf -- '- %s\n' "$image_ref"
            done <<< "$IMAGE_REFS"
          } >> "$GITHUB_STEP_SUMMARY"
